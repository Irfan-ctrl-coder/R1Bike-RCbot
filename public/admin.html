<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R1 Bikes Admin Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f0f2f5; }
    
    /* Sidebar */
    .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #075e54; color: #ffffff; font-size: 18px; font-weight: bold; }
    .auth-box { padding: 10px 15px; background: #e8f5e9; border-bottom: 1px solid #c8e6c9; display: flex; gap: 8px; }
    .auth-box input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
    .auth-box button { padding: 6px 12px; background: #128c7e; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    
    .conversation-list { flex: 1; overflow-y: auto; }
    .conv-item { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; }
    .conv-item:hover, .conv-item.active { background: #f5f6f6; }
    .conv-header { display: flex; justify-content: space-between; font-weight: bold; color: #333; }
    .conv-preview { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { background: #25d366; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold; align-self: flex-end; }
    
    /* Chat Area */
    .chat-container { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { padding: 12px 20px; background: #f0f2f5; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h3 { color: #333; font-size: 16px; }
    .btn-delete-chat { background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 65%; padding: 8px 12px; border-radius: 7.5px; position: relative; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
    .message.user { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
    .message.admin { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
    .msg-time { font-size: 10px; color: #888; align-self: flex-end; margin-top: 4px; }
    .msg-actions { position: absolute; top: 4px; right: 4px; opacity: 0; transition: opacity 0.2s; cursor: pointer; }
    .message:hover .msg-actions { opacity: 1; }
    .delete-msg-btn { font-size: 12px; color: #888; }
    .delete-msg-btn:hover { color: #d32f2f; }

    /* Media Styling */
    .message img { max-width: 100%; max-height: 250px; border-radius: 5px; margin-bottom: 4px; }
    .message audio { width: 220px; margin-top: 4px; }

    /* Input Footer */
    .chat-footer { padding: 10px 15px; background: #f0f2f5; display: flex; gap: 8px; align-items: center; border-top: 1px solid #e0e0e0; }
    .chat-footer input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .chat-footer button { padding: 10px 16px; background: #128c7e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    /* Media Picker Buttons */
    .media-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 4px; }
    .hidden-input { display: none; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">R1 Bikes Chats</div>
    <div class="auth-box">
      <input type="password" id="adminPassword" placeholder="Admin Password">
      <button onclick="saveAuth()">Login</button>
    </div>
    <div class="conversation-list" id="convList"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container">
    <div class="chat-header" id="chatHeader">
      <h3 id="currentChatTitle">Select a chat to begin</h3>
      <button class="btn-delete-chat" id="deleteChatBtn" style="display:none;" onclick="deleteCurrentChat()">Delete Chat</button>
    </div>

    <div class="messages-box" id="messagesBox"></div>

    <div class="chat-footer" id="chatFooter" style="display:none;">
      <!-- Direct Gallery Picker -->
      <button class="media-btn" title="Send Image (Gallery)" onclick="document.getElementById('imageInput').click()">🖼️</button>
      <input type="file" id="imageInput" class="hidden-input" accept="image/*" onchange="sendFile(this.files[0])">

      <!-- Document Picker -->
      <button class="media-btn" title="Send Document" onclick="document.getElementById('docInput').click()">📄</button>
      <input type="file" id="docInput" class="hidden-input" accept=".pdf,.doc,.docx,.txt" onchange="sendFile(this.files[0])">

      <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
      <button onclick="sendTextMessage()">Send</button>
    </div>
  </div>

  <script>
    let activeWaId = null;
    let ADMIN_PASSWORD = localStorage.getItem('admin_pass') || '';
    document.getElementById('adminPassword').value = ADMIN_PASSWORD;

    const socket = io();

    socket.on('connect', () => { console.log('WebSocket Connected'); });

    socket.on('new_message', (data) => {
      loadConversations();
      if (data.wa_id === activeWaId) {
        appendMessage(data.message);
      }
    });

    socket.on('message_deleted', (data) => {
      if (data.wa_id === activeWaId) {
        const msgElem = document.getElementById(`msg-${data.msg_id}`);
        if (msgElem) msgElem.remove();
      }
      loadConversations();
    });

    socket.on('conversation_deleted', (data) => {
      if (data.wa_id === activeWaId) {
        activeWaId = null;
        document.getElementById('messagesBox').innerHTML = '';
        document.getElementById('currentChatTitle').innerText = 'Select a chat to begin';
        document.getElementById('chatFooter').style.display = 'none';
        document.getElementById('deleteChatBtn').style.display = 'none';
      }
      loadConversations();
    });

    function saveAuth() {
      ADMIN_PASSWORD = document.getElementById('adminPassword').value.trim();
      localStorage.setItem('admin_pass', ADMIN_PASSWORD);
      loadConversations();
    }

    async function loadConversations() {
      try {
        const res = await fetch('/admin/conversations', {
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
        if (!res.ok) return;
        const data = await res.json();
        
        const listElem = document.getElementById('convList');
        listElem.innerHTML = '';
        
        data.conversations.forEach(c => {
          const div = document.createElement('div');
          div.className = `conv-item ${c.wa_id === activeWaId ? 'active' : ''}`;
          div.onclick = () => openChat(c.wa_id);
          div.innerHTML = `
            <div class="conv-header">
              <span>+${c.wa_id}</span>
              ${c.unreadCount ? `<span class="badge">${c.unreadCount}</span>` : ''}
            </div>
            <div class="conv-preview">${c.lastMessage || 'No messages'}</div>
          `;
          listElem.appendChild(div);
        });
      } catch (err) {
        console.error('Failed to load conversations:', err);
      }
    }

    async function openChat(wa_id) {
      activeWaId = wa_id;
      document.getElementById('currentChatTitle').innerText = `Chatting with +${wa_id}`;
      document.getElementById('chatFooter').style.display = 'flex';
      document.getElementById('deleteChatBtn').style.display = 'block';
      loadConversations();

      try {
        const res = await fetch(`/admin/messages/${wa_id}`, {
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
        const data = await res.json();
        const box = document.getElementById('messagesBox');
        box.innerHTML = '';
        data.messages.forEach(appendMessage);
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        console.error('Failed to load messages:', err);
      }
    }

    function appendMessage(msg) {
      const box = document.getElementById('messagesBox');
      const div = document.createElement('div');
      div.className = `message ${msg.sender}`;
      div.id = `msg-${msg.id || msg.wamid}`;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.content)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.content}" alt="Image"><div>${escapeHtml(msg.caption || '')}</div>`;
      } else if (msg.type === 'audio') {
        contentHtml = `<audio controls src="${msg.content}"></audio>`;
      } else if (msg.type === 'document') {
        contentHtml = `<a href="${msg.content}" target="_blank">📄 ${escapeHtml(msg.filename || 'Document')}</a>`;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="msg-actions">
          <span class="delete-msg-btn" onclick="deleteMessage('${msg.id || msg.wamid}')" title="Delete Message">🗑️</span>
        </div>
        ${contentHtml}
        <div class="msg-time">${timeStr}</div>
      `;

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function sendTextMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeWaId) return;

      input.value = '';
      try {
        await fetch('/admin/send-text', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': ADMIN_PASSWORD
          },
          body: JSON.stringify({ to: activeWaId, message: text })
        });
      } catch (err) {
        console.error('Error sending message:', err);
      }
    }

    async function sendFile(file) {
      if (!file || !activeWaId) return;
      const formData = new FormData();
      formData.append('to', activeWaId);
      formData.append('file', file);

      try {
        await fetch('/admin/send-file', {
          method: 'POST',
          headers: { 'x-admin-password': ADMIN_PASSWORD },
          body: formData
        });
      } catch (err) {
        console.error('Error uploading file:', err);
      }
    }

    async function deleteMessage(msgId) {
      if (!confirm('Delete this message?')) return;
      try {
        await fetch(`/admin/messages/${activeWaId}/${msgId}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
      } catch (err) {
        console.error('Failed to delete message:', err);
      }
    }

    async function deleteCurrentChat() {
      if (!confirm(`Are you sure you want to delete the entire chat for +${activeWaId}?`)) return;
      try {
        await fetch(`/admin/conversations/${activeWaId}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
      } catch (err) {
        console.error('Failed to delete chat:', err);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendTextMessage();
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    if (ADMIN_PASSWORD) loadConversations();
  </script>
</body>
</html>
