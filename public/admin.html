<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R1 Bikes Admin Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; background-color: #d1d7db; overflow: hidden; }

    /* App Wrapper */
    .app-container { display: flex; width: 100%; height: 100%; max-width: 1600px; margin: 0 auto; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.1); }

    /* Left Sidebar */
    .sidebar { width: 30%; min-width: 340px; max-width: 450px; background: #ffffff; border-right: 1px solid #e9edef; display: flex; flex-direction: column; }
    
    .sidebar-header { height: 60px; background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e9edef; }
    .sidebar-header h2 { font-size: 18px; color: #111b21; font-weight: 600; }
    
    .auth-box { padding: 8px 12px; background: #f6f8fa; border-bottom: 1px solid #e9edef; display: flex; gap: 8px; }
    .auth-box input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
    .auth-box button { padding: 8px 14px; background: #00a884; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }

    .conversation-list { flex: 1; overflow-y: auto; }
    .conv-item { padding: 12px 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: background 0.15s ease; }
    .conv-item:hover { background: #f5f6f6; }
    .conv-item.active { background: #f0f2f5; }
    
    .conv-header { display: flex; justify-content: space-between; align-items: center; }
    .conv-title { font-weight: 600; color: #111b21; font-size: 15px; }
    .conv-preview { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85%; }
    .badge { background: #25d366; color: white; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: bold; }

    /* Right Chat Main Panel */
    .chat-container { flex: 1; display: flex; flex-direction: column; background: #efeae2; position: relative; }
    .chat-container::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; opacity: 0.08; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); pointer-events: none; }

    .chat-header { height: 60px; background: #f0f2f5; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e9edef; z-index: 1; }
    .chat-header h3 { color: #111b21; font-size: 16px; font-weight: 600; }
    .btn-delete-chat { background: #ea0038; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

    /* Messages Display Box */
    .messages-box { flex: 1; padding: 20px 5%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
    
    .message { max-width: 60%; padding: 8px 12px; border-radius: 8px; position: relative; font-size: 14.2px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(11,20,26,0.13); }
    .message.user { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; color: #111b21; }
    .message.admin { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; color: #111b21; }

    .msg-content { margin-right: 15px; }
    .msg-time { font-size: 10.5px; color: #667781; text-align: right; margin-top: 3px; }
    
    /* Delete Hover Action */
    .msg-actions { position: absolute; top: 4px; right: 6px; opacity: 0; transition: opacity 0.2s; cursor: pointer; }
    .message:hover .msg-actions { opacity: 1; }
    .delete-msg-btn { font-size: 12px; filter: grayscale(1); }
    .delete-msg-btn:hover { filter: grayscale(0); transform: scale(1.1); }

    /* Media Styling */
    .message img { max-width: 100%; max-height: 280px; border-radius: 6px; margin-top: 4px; display: block; }
    .message audio { width: 250px; margin-top: 6px; }
    .message a { color: #027eb5; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }

    /* Footer Input Area */
    .chat-footer { padding: 10px 16px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; z-index: 1; border-top: 1px solid #e9edef; }
    .chat-footer input[type="text"] { flex: 1; padding: 11px 16px; border: 1px solid #fff; border-radius: 8px; outline: none; font-size: 14.5px; background: #ffffff; }
    .chat-footer button.send-btn { padding: 10px 18px; background: #00a884; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }

    /* Gallery / Media Icon Buttons */
    .media-btn { background: none; border: none; font-size: 22px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; padding: 0 4px; }
    .media-btn:hover { opacity: 1; }
    .hidden-input { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Left Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>R1 Bikes Dashboard</h2>
      </div>
      <div class="auth-box">
        <input type="password" id="adminPassword" placeholder="Admin Password">
        <button onclick="saveAuth()">Login</button>
      </div>
      <div class="conversation-list" id="convList"></div>
    </div>

    <!-- Right Chat Main Area -->
    <div class="chat-container">
      <div class="chat-header" id="chatHeader">
        <h3 id="currentChatTitle">Select a conversation</h3>
        <button class="btn-delete-chat" id="deleteChatBtn" style="display:none;" onclick="deleteCurrentChat()">Delete Entire Chat</button>
      </div>

      <div class="messages-box" id="messagesBox"></div>

      <div class="chat-footer" id="chatFooter" style="display:none;">
        <!-- Direct Gallery Access -->
        <button class="media-btn" title="Send Photo (Gallery)" onclick="document.getElementById('imageInput').click()">📷</button>
        <input type="file" id="imageInput" class="hidden-input" accept="image/*" onchange="sendFile(this.files[0])">

        <!-- Document Picker -->
        <button class="media-btn" title="Send Document" onclick="document.getElementById('docInput').click()">📎</button>
        <input type="file" id="docInput" class="hidden-input" accept=".pdf,.doc,.docx,.txt" onchange="sendFile(this.files[0])">

        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendTextMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let activeWaId = null;
    let ADMIN_PASSWORD = localStorage.getItem('admin_pass') || '';
    document.getElementById('adminPassword').value = ADMIN_PASSWORD;

    const socket = io();

    socket.on('connect', () => { console.log('WebSocket Connected'); });

    socket.on('new_message', (data) => {
      loadConversations();
      if (data.wa_id === activeWaId) {
        appendMessage(data.message);
      }
    });

    socket.on('message_deleted', (data) => {
      if (data.wa_id === activeWaId) {
        const msgElem = document.getElementById(`msg-${data.msg_id}`);
        if (msgElem) msgElem.remove();
      }
      loadConversations();
    });

    socket.on('conversation_deleted', (data) => {
      if (data.wa_id === activeWaId) {
        activeWaId = null;
        document.getElementById('messagesBox').innerHTML = '';
        document.getElementById('currentChatTitle').innerText = 'Select a conversation';
        document.getElementById('chatFooter').style.display = 'none';
        document.getElementById('deleteChatBtn').style.display = 'none';
      }
      loadConversations();
    });

    function saveAuth() {
      ADMIN_PASSWORD = document.getElementById('adminPassword').value.trim();
      localStorage.setItem('admin_pass', ADMIN_PASSWORD);
      loadConversations();
    }

    async function loadConversations() {
      try {
        const res = await fetch('/admin/conversations', {
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
        if (!res.ok) return;
        const data = await res.json();
        
        const listElem = document.getElementById('convList');
        listElem.innerHTML = '';
        
        data.conversations.forEach(c => {
          const div = document.createElement('div');
          div.className = `conv-item ${c.wa_id === activeWaId ? 'active' : ''}`;
          div.onclick = () => openChat(c.wa_id);
          div.innerHTML = `
            <div class="conv-header">
              <span class="conv-title">+${c.wa_id}</span>
              ${c.unreadCount ? `<span class="badge">${c.unreadCount}</span>` : ''}
            </div>
            <div class="conv-preview">${c.lastMessage || 'No messages'}</div>
          `;
          listElem.appendChild(div);
        });
      } catch (err) {
        console.error('Failed to load conversations:', err);
      }
    }

    async function openChat(wa_id) {
      activeWaId = wa_id;
      document.getElementById('currentChatTitle').innerText = `+${wa_id}`;
      document.getElementById('chatFooter').style.display = 'flex';
      document.getElementById('deleteChatBtn').style.display = 'block';
      loadConversations();

      try {
        const res = await fetch(`/admin/messages/${wa_id}`, {
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
        const data = await res.json();
        const box = document.getElementById('messagesBox');
        box.innerHTML = '';
        data.messages.forEach(appendMessage);
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        console.error('Failed to load messages:', err);
      }
    }

    function appendMessage(msg) {
      const box = document.getElementById('messagesBox');
      const div = document.createElement('div');
      div.className = `message ${msg.sender}`;
      div.id = `msg-${msg.id || msg.wamid}`;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div class="msg-content">${escapeHtml(msg.content)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<div class="msg-content"><img src="${msg.content}" alt="Photo"><div>${escapeHtml(msg.caption || '')}</div></div>`;
      } else if (msg.type === 'audio') {
        contentHtml = `<div class="msg-content"><audio controls src="${msg.content}"></audio></div>`;
      } else if (msg.type === 'document') {
        contentHtml = `<div class="msg-content"><a href="${msg.content}" target="_blank">📄 ${escapeHtml(msg.filename || 'Document')}</a></div>`;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="msg-actions">
          <span class="delete-msg-btn" onclick="deleteMessage('${msg.id || msg.wamid}')" title="Delete Message">🗑️</span>
        </div>
        ${contentHtml}
        <div class="msg-time">${timeStr}</div>
      `;

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function sendTextMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeWaId) return;

      input.value = '';
      try {
        await fetch('/admin/send-text', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': ADMIN_PASSWORD
          },
          body: JSON.stringify({ to: activeWaId, message: text })
        });
      } catch (err) {
        console.error('Error sending message:', err);
      }
    }

    async function sendFile(file) {
      if (!file || !activeWaId) return;
      const formData = new FormData();
      formData.append('to', activeWaId);
      formData.append('file', file);

      try {
        await fetch('/admin/send-file', {
          method: 'POST',
          headers: { 'x-admin-password': ADMIN_PASSWORD },
          body: formData
        });
      } catch (err) {
        console.error('Error uploading file:', err);
      }
    }

    async function deleteMessage(msgId) {
      if (!confirm('Delete this message?')) return;
      try {
        await fetch(`/admin/messages/${activeWaId}/${msgId}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
      } catch (err) {
        console.error('Failed to delete message:', err);
      }
    }

    async function deleteCurrentChat() {
      if (!confirm(`Delete entire chat for +${activeWaId}?`)) return;
      try {
        await fetch(`/admin/conversations/${activeWaId}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': ADMIN_PASSWORD }
        });
      } catch (err) {
        console.error('Failed to delete chat:', err);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendTextMessage();
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    if (ADMIN_PASSWORD) loadConversations();
  </script>
</body>
</html>
